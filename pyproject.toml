[project]
name = "model-router"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "cryptography>=45,<52",
    "argon2-cffi>=23,<26",
]

[project.optional-dependencies]
discovery = [
    "psutil>=7,<9",
    "zeroconf>=0.145,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
